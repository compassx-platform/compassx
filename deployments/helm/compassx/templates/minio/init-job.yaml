{{- if and .Values.minio.enabled .Values.minio.defaultBuckets }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "compassx.minioFullname" . }}-init-buckets
  labels:
    {{- include "compassx.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "compassx.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-03-03T00-13-08Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set minio http://{{ include "compassx.minioFullname" . }}:9000 {{ .Values.minio.auth.rootUser }} $MINIO_ROOT_PASSWORD; do
                echo 'Waiting for MinIO...'
                sleep 2
              done
              {{- range .Values.minio.defaultBuckets }}
              mc mb --ignore-existing minio/{{ . }}
              {{- end }}
              echo 'MinIO buckets created successfully.'
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "compassx.fullname" . }}-secrets
                  key: minio-root-password
{{- end }}
