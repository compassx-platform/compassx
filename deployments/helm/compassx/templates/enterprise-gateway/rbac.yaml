{{- if .Values.enterpriseGateway.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compassx.enterpriseGatewayServiceAccountName" . }}
  labels:
    {{- include "compassx.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "compassx.enterpriseGatewayFullname" . }}-role
  labels:
    {{- include "compassx.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "compassx.enterpriseGatewayFullname" . }}-rolebinding
  labels:
    {{- include "compassx.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "compassx.enterpriseGatewayServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "compassx.enterpriseGatewayFullname" . }}-role
{{- end }}
