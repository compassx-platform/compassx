{{- if .Values.airflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compassx.airflowFullname" . }}
  labels:
    {{- include "compassx.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow-webserver
spec:
  type: {{ .Values.airflow.webserver.service.type }}
  ports:
    - port: {{ .Values.airflow.webserver.service.port }}
      targetPort: {{ .Values.airflow.webserver.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "compassx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: airflow-webserver
{{- end }}
