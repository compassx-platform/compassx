[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests compassx/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
asyncio_mode = auto

addopts =
    --tb=short
    --strict-markers
    -q
    --color=yes

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    unit: Pure unit tests (no DB, no network)
    integration: Integration tests (test DB, FastAPI TestClient)
    slow: Tests that take more than 1 second
    asyncio: mark a test as an asyncio test
    docker: Integration tests requiring a Docker daemon
    kubernetes: Integration tests requiring a Kubernetes cluster

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli = false
log_level = WARNING

# ── Warnings ─────────────────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SAWarning