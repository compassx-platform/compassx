# CompassX Service Registry definitions.
#
# For every platform service, define how it is reached in each deployment
# mode. The active mode per service comes from the deployment profile
# (compassx/profiles/*.yaml); this file only describes endpoints.
#
# local      -> service reachable from the host (native process or port-forward)
# docker     -> service reachable via docker-compose network hostname
# kubernetes -> service reachable via Kubernetes Service cluster-internal DNS
#
# Override any value with env vars: COMPASSX_SERVICE_<NAME>_<MODE>_HOST / _PORT
# (name uppercased, dashes -> underscores), e.g. COMPASSX_SERVICE_POSTGRES_LOCAL_HOST.

services:
  backend:
    local:      { host: localhost, port: 8000, protocol: http }
    docker:     { host: backend, port: 8000, protocol: http }
    kubernetes: { host: compassx-backend-service.compassx.svc.cluster.local, port: 8000, protocol: http }

  frontend:
    local:      { host: localhost, port: 5173, protocol: http }
    docker:     { host: frontend, port: 80, protocol: http }
    kubernetes: { host: compassx-frontend-service.compassx.svc.cluster.local, port: 80, protocol: http }

  postgres:
    local:      { host: localhost, port: 5433, protocol: postgresql }
    docker:     { host: postgres, port: 5432, protocol: postgresql }
    kubernetes: { host: compassx-postgres.compassx.svc.cluster.local, port: 5432, protocol: postgresql }

  redis:
    local:      { host: localhost, port: 6379, protocol: redis }
    docker:     { host: redis, port: 6379, protocol: redis }
    kubernetes: { host: compassx-redis.compassx.svc.cluster.local, port: 6379, protocol: redis }

  minio:
    local:      { host: localhost, port: 9000, protocol: http }
    docker:     { host: minio, port: 9000, protocol: http }
    kubernetes: { host: minio.compassx.svc.cluster.local, port: 9000, protocol: http }

  minio-console:
    local:      { host: localhost, port: 9001, protocol: http }
    docker:     { host: minio, port: 9001, protocol: http }
    kubernetes: { host: minio-console.compassx.svc.cluster.local, port: 9001, protocol: http }

  airflow:
    local:      { host: localhost, port: 8080, protocol: http }
    docker:     { host: airflow-webserver, port: 8080, protocol: http }
    kubernetes: { host: compassx-airflow.compassx.svc.cluster.local, port: 8080, protocol: http }

  enterprise-gateway:
    local:      { host: localhost, port: 8888, protocol: http }
    docker:     { host: enterprise-gateway, port: 8888, protocol: http }
    kubernetes: { host: compassx-enterprise-gateway.compassx.svc.cluster.local, port: 8888, protocol: http }

  jupyter-server:
    # local: port-forward from localhost:8889 -> cluster service
    local:      { host: localhost, port: 8889, protocol: http }
    docker:     { host: jupyter-server, port: 8889, protocol: http }
    # kubernetes: cluster-internal — jupyter-server listens on 8889
    kubernetes: { host: compassx-jupyter-server.compassx.svc.cluster.local, port: 8889, protocol: http }

  prometheus:
    local:      { host: localhost, port: 9090, protocol: http }
    docker:     { host: prometheus, port: 9090, protocol: http }
    kubernetes: { host: compassx-prometheus.compassx.svc.cluster.local, port: 9090, protocol: http }
